<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Principal</title>
  </head>

  <style>
    body {
      background-color: black;
      background-image: url("imagens/CatedralPrincipal.jpg");
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;

      display: flex;
      min-height: 100vh;
      flex-direction: column;
    }
    .conteudo {
      font-family: "Times New Roman", sans-serif;
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;
    }
    footer {
      color: antiquewhite;
      background-color: rgb(0, 0, 0);
      opacity: 0.5;

      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: auto;
      bottom: 0px;
      right: 0px;

      height: 150px;
      width: 100%;
      border-radius: 12px 12px 0px 0px;
      font-size: 14px;
    }
    #banners {
      display: flex;
      justify-self: center;
      justify-content: center;
      gap: 100px;
    }
    .imagem {
      background-color: black;
      border-radius: 12px;
      box-shadow: 6px 8px rgba(0, 0, 0, 0.6);

      height: 608px;
      width: 321px;
      padding: 0px; /* Distância entre o meio e as bordas internas */
    }
    a {
      transition: 0.3s;
      text-decoration: none;
      color: inherit;
    }
    a:hover {
      scale: 102%;
    }
    header ul {
      font-family: "Arial Rounded MT Bold", Arial, sans-serif;
      display: flex;
      gap: 20px;
    }
    header {
      color: white;
      background-color: rgba(0, 0, 0, 0.7);

      width: 100%;

      display: flex;
      position: sticky;
      top: 0px;
      justify-content: center;
      align-items: center;
    }
  </style>

  <body>
    <header>
      <nav>
        <ul>
          <a href="index.html">HOME</a>
          <a>|</a>
          <a href="contatos.html">CONTATOS</a>
          <a></a>
        </ul>
      </nav>
    </header>
    <div class="conteudo">
      <h1>CATOLICISMO</h1>
    </div>
    <div id="banners">
      <a href="coroa.html">
        <img
          class="imagem"
          src="imagens/banner1.jpg"
          alt="Coroa das Lágrimas"
        />
      </a>
      <a href="apostolos.html">
        <img class="imagem" src="imagens/banner2.jpg" alt="Apóstolos" />
      </a>
    </div>
    <footer>
      <h1>"Que Deus esteja em vossos corações".</h1>
    </footer>
  </body>
</html>

<!DOCTYPE html>
<html>
	<head>
		<title>Inline Style</title>
		<meta charset="utf-8">
		
	</head>
	<body>

		<h1>Estilo CSS (cascading style sheets)</h1>
		<p style=" color: green; ">
			Aqui você vai aplicar o estilo dentro do paragrafo, aplicando as cores diretamente na tag p
		</p>

		<p style=" color: green; ">
			Lembrando que p é uma tag que permite a troca de linha dentro do html.
		</p>
        <p style=" color: rgb(39, 26, 132); ">
			<!-- Alt+Shift+A aciona o comentario dentro do html -->
            <!-- A palavra style dento da tag adiciona um estilo para linha ou seja IN LINE  -->
            <!-- A palavra color: altera a cor da fonte, temos varios tipos de cores dentro do html -->
		</p>

	</body>
</html>

<!-- Para testar o que fazer no grid, inpecione a página,
vá em Body e escolha a grid de algum elemento (div.container
por exemplo) -->
<!-- grid-template-columns - Divide o elemento em colunas (vertical) -->
<!-- grid-template-rows - Divide o elemento em linhas (horizontal)  --> 

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GridLayout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body{
            background-color: antiquewhite;
        }
        h1{
            text-align: center;
            color: rgb(0, 0, 0);
        }
        div.container{
            display: grid;
            border: 30px solid antiquewhite;
            grid-template-columns: auto auto auto;
            gap: 30px;
        }
        div.itens{
            border: 20px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
            
        }

        div.itens img{
            max-width: 100%;
            height: auto;        
        }
        .fotos{
            width: 800px;
            height: 150px;
        }
        .propaganda{
            display: flex;
            justify-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <h1>TEXTO</h1>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <div class="propaganda">
        <div id="carouselExampleIndicators" class="carousel slide">
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
  </div>
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img class="fotos" src="imagens/imagem1.jpeg" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img class="fotos" src="imagens/imagem2.jpeg" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img class="fotos" src="imagens/imagem3.jpeg" class="d-block w-100" alt="...">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
    </div>

    <div class="container">
        <div class="itens"><img src="imagens/imagem1.jpeg"></div>
        <div class="itens"><img src="imagens/imagem2.jpeg"></div>
        <div class="itens"><img src="imagens/imagem3.jpeg"></div>
        <div class="itens"><img src="imagens/imagem4.jpeg"></div>
        <div class="itens"><img src="imagens/imagem5.jpeg"></div>
        <div class="itens"><img src="imagens/imagem6.jpeg"></div>
        <div class="itens"><img src="imagens/imagem7.jpeg"></div>
        <div class="itens"><img src="imagens/imagem8.jpeg"></div>
        <div class="itens"><img src="imagens/imagem9.jpeg"></div>
        <div class="itens"><img src="imagens/imagem10.jpeg"></div>
    </div>




    </div>
</body>
</html>

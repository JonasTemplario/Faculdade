<!-- Para testar o que fazer no grid, inpecione a página,
vá em Body e escolha a grid de algum elemento (div.container
por exemplo) -->
<!-- grid-template-columns - Divide o elemento em colunas (vertical) -->
<!-- grid-template-rows - Divide o elemento em linhas (horizontal)  --> 

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GridLayout</title>

    <style>
        div.container{
            border: 2px solid green;
            display: grid;
            grid-template-columns: 1fr 50fr 1fr;

            grid-gap: 10px;
            height: 500px;
        }
        div.itens{
            border: 2px solid red;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="itens">1</div>
        <div class="itens">2</div>
        <div class="itens">3</div>
        <div class="itens">4</div>
        <div class="itens">5</div>
        <div class="itens">6</div>
        <div class="itens">7</div>
        <div class="itens">8</div>
        <div class="itens">9</div>





    </div>
</body>
</html>

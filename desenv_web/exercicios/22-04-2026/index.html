<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Grid</title>
    <style>
        div{
            background-color: red;
            width: 100px;
            height: 100px;
            margin: 20px;
            padding: 20px;
            border: 1px solid green;
        }
        @media (max-width: 1000px){
            div{
                background-color: blue;
                width: 150px;
                height: 150px;
            }
        @media (max-width: 600px){
            div{
                background-color: green;
                width: 250px;
                height: 250px;
            }
        }
        }
    </style>
</head>
<body>
    <div class="div"></div>
    <div class="div"></div>
    <div class="div"></div>
</body>
</html>

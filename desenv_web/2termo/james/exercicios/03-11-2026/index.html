<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dflex">
        <div class="calc dflex" id="calc">
            <div class="nome dflex" id="nome">
                <p>Calculadora do Patrão</p>
            </div>
            <div class="div_display dflex" id="div_display">
                <p class="display" id="display">0</p>
            </div>
            <div class="div_teclas" id="div_teclas">
                <button class="tecla" id="tcls">CLS</button>
                <button class="tecla num" id="t(">(</button>
                <button class="tecla num" id="t)">)</button>
                <button class="teclaOp clear" id="ton">&#x21E6;</button>
                <button class="tecla num" id="t7">7</button>
                <button class="tecla num" id="t8">8</button>
                <button class="tecla num" id="t9">9</button>
                <button class="teclaOp op" id="t+">+</button>
                <button class="tecla num" id="t4">4</button>
                <button class="tecla num" id="t5">5</button>
                <button class="tecla num" id="t6">6</button>
                <button class="teclaOp op" id="t-">-</button>
                <button class="tecla num" id="t1">1</button>
                <button class="tecla num" id="t2">2</button>
                <button class="tecla num" id="t3">3</button>
                <button class="teclaOp op" id="tx">x</button>
                <button class="tecla num" id="t0">0</button>
                <button class="tecla num" id="tseparador">,</button>
                <button class="teclaOp res" id="tigual">=</button>
                <button class="teclaOp op" id="td">/</button>
            </div>
        </div>
    </div>

    <script src="./dist/calc.js"></script>
</body>
</html>
